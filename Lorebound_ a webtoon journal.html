<style>
:root{box-sizing:border-box;color-scheme:light;--desk:#d6c8ae;--leather:#5e3a22;--paper:#f3e9d6;--ink:#2b2118;--pen:#1f3558;--red:#8a2b2b;--rule:rgba(90,65,40,.28);--gold:#e6c98f}
*,*:before,*:after{box-sizing:inherit}
body{margin:0;background:var(--desk);font:18px/1.55 "IM Fell English",Georgia,serif;color:var(--ink);padding-bottom:env(safe-area-inset-bottom,0px)}

.top nav{display:flex;flex-wrap:wrap;gap:2px 14px}
.top nav a{color:var(--gold);text-decoration:none;opacity:.75;padding:2px 0;border-bottom:2px solid transparent}

main{max-width:780px;margin:18px auto;background:var(--paper);padding:26px clamp(16px,5vw,44px) 40px;border-radius:6px;box-shadow:0 6px 14px rgba(40,25,10,.3);min-height:70vh}

button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid var(--red);outline-offset:2px}
.row{display:flex;gap:8px;align-items:center}.row>span{flex:1}
.dots button{border:0;background:none;padding:0 3px;font-size:26px;color:var(--red);line-height:1}
.opts{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}

.item:hover{background:rgba(138,43,43,.06)}
.item small{color:#7d6a56}

.note button,.item button{border:0;background:none;padding:0 4px}
.coll{position:relative;height:min(70vh,460px);margin-top:10px;border:1.5px dashed var(--rule);border-radius:6px;overflow:hidden}
.ph{position:absolute;width:38%;background:#fffaf0;padding:6px 6px 16px;box-shadow:0 3px 8px rgba(40,25,10,.4);touch-action:none;cursor:grab}
.ph img{display:block;width:100%;pointer-events:none}
.ph button{position:absolute;top:-8px;right:-8px;border-radius:50%;width:26px;height:26px;padding:0;line-height:1;background:#fffaf0}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:34px}
.item small button{border:1px dashed var(--rule);margin-left:6px;font-size:14px;padding:1px 8px}
.bury{border:1px dashed var(--rule);padding:8px 10px;margin:2px 0 8px;background:rgba(255,255,255,.3)}
.cv .top{display:none}
.cv main{background:radial-gradient(ellipse at 30% 20%,rgba(255,255,255,.12),transparent 60%),var(--leather);color:var(--gold);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;min-height:calc(100vh - 36px);position:relative}
.cv main:before{content:"";position:absolute;inset:14px;border:2px dashed rgba(230,201,143,.55);border-radius:6px;pointer-events:none}

.cv h1{font-size:clamp(38px,9vw,60px);font-weight:400;letter-spacing:2px;margin:10px 0 0;text-shadow:0 -1px 0 rgba(0,0,0,.6)}
.cv p{font-style:italic;opacity:.85;margin:8px 0}
.open{display:inline-block;margin-top:22px;padding:10px 26px;border:1.5px solid var(--gold);border-radius:4px;color:var(--gold);text-decoration:none;font-size:19px}
#print{display:none}
@media print{body{background:#fff}.top,main{display:none!important}#print{display:block;color:#000;font:12pt/1.45 "IM Fell English",Georgia,serif}#print h1{font-size:30pt;margin:0}#print h2{font-size:20pt;margin:0 0 4pt}#print h3{font-size:14pt;margin:14pt 0 4pt;color:#8a2b2b}#print p{margin:0 0 7pt}.pg{break-before:page}.im{display:flex;flex-wrap:wrap;gap:8px}.im img{max-width:48%;max-height:220px}}

<script>

["The story",[["t","I came for"],["t","I stayed because"],["t","I almost left when"],["t","And then it got me with"],["t","What I actually remember"],["t","The character who owns this story"],["t","What I wish the author had done differently"],["t","This story, without naming its genre"]]],

addEventListener("pagehide",doSave);document.addEventListener("visibilitychange",function(){if(document.hidden)doSave()});

function home(){var u=db.ui,f=u.f||"All",newest=u.n!==false,
L=db.items.map(function(x,j){return[x,j]}).filter(function(o){return f=="All"||o[0].status==f});if(newest)L.reverse();
var h='<h2>Index</h2><p class="sub">'+db.items.length+' logged'+(db.total?' of '+esc(db.total):'')+'.</p><label>Total in my library</label><input data-tot value="'+esc(db.total)+'" inputmode="numeric"><label>New title</label><input id="nt" placeholder="Title"><div class="row"><input id="ng" placeholder="Genre"><input id="ne" placeholder="Episodes" inputmode="numeric"></div><p><button data-act="add">Add to the journal</button></p>';
h+='<div class="opts">'+["All"].concat(STAT).map(function(s){return'<button data-flt="'+s+'" class="'+(s==f?"on":"")+'">'+s+'</button>'}).join("")+'<button data-act="sort">'+(newest?"Newest first":"Oldest first")+' ⇅</button></div>';
L.forEach(function(o){var x=o[0];h+='<div class="item"><a href="#t/'+x.id+'" style="flex:1;color:inherit;text-decoration:none">'+pad(o[1]+1)+'  '+esc(x.title)+'</a><small>'+esc(x.status)+' <button data-bury="'+x.id+'">⚰ Graveyard</button></small></div>';if(db.ui.bury==x.id)h+='<div class="bury"><div class="row"><input id="bg" placeholder="Stopped at ep." inputmode="numeric"><select id="bw">'+DNF.map(function(d){return'<option>'+d+'</option>'}).join("")+'</select></div><p style="margin:8px 0 0"><button data-buryok="'+x.id+'">Move to graveyard</button> <button data-burycx="1">Cancel</button></p></div>'});

function title(it){var id=it.id,j=db.items.indexOf(it),a=' data-id="'+id+'"',h='<p><a href="#index">← Index</a></p><p class="sub">No. '+pad(j+1)+'</p><input class="big"'+a+' data-f="title" value="'+esc(it.title)+'" aria-label="Title"><label>Genre</label><input'+a+' data-f="genre" value="'+esc(it.genre)+'"><label>Episodes</label><input'+a+' data-f="eps" value="'+esc(it.eps)+'" inputmode="numeric"><label>Status</label><select'+a+' data-f="status">'+STAT.map(function(s){return'<option'+(it.status===s?" selected":"")+'>'+s+'</option>'}).join("")+'</select>';
for(var i=0;i<5;i++)h+=sec(i,it);

(it.m||[]).forEach(function(m,k){h+='<div class="note hw">Ep. '+esc(m.ep)+': '+esc(m.n)+' <button'+a+' data-delm="'+k+'" aria-label="Delete">×</button></div>'});
h+='<div class="row"><input id="mep" placeholder="Ep." style="width:70px" inputmode="numeric"><input id="mn" placeholder="Oh. OH."></div><p><button'+a+' data-act="addm">Add note</button></p>';
h+=sec(5,it)+sec(6,it)+sec(7,it);

function fav(){var h='<h2>The favourites</h2><p class="sub">Unranked. Just categories.</p>';FAV.forEach(function(f,j){h+='<label>'+f+'</label><textarea data-fav="'+j+'">'+esc(db.fav[j])+'</textarea>'});return h}
function grave(){var h='<h2>The graveyard</h2><p class="sub">Abandoned series.</p><input id="gt" placeholder="Title"><div class="row"><input id="ga" placeholder="Stopped at ep." inputmode="numeric"><select id="gw">'+DNF.map(function(d){return'<option>'+d+'</option>'}).join("")+'</select></div><p><button data-act="addg">Bury it</button></p>';
db.grave.forEach(function(g,j){h+='<div class="item"><span>'+esc(g.t)+'</span><small>ep. '+esc(g.a||"?")+', '+esc(g.w)+' <button data-delg="'+j+'" aria-label="Delete">×</button></small></div>'});return h}
function dna(){var h='<h2>My reading DNA</h2><p class="sub">What makes a story become mine?</p>';DNA.forEach(function(d){h+='<label>'+d[1]+'</label><textarea data-dna="'+d[0]+'">'+esc(db.dna[d[0]])+'</textarea>'});return h}
function tools(){return'<h2>Backup and export</h2><p class="sub">Your journal lives in this browser. Download a backup file now and then.</p><div class="acts" style="margin-top:14px"><button data-act="pdf">Export the whole journal as PDF</button><button data-act="exp">Download backup file</button><label class="btn">Restore from backup file<input type="file" accept=".json,application/json" data-restore style="position:absolute;width:1px;height:1px;opacity:0"></label></div><p class="tiny" id="msg" style="margin-top:14px">'+esc(msg)+'</p><p class="tiny">PDF opens your browser’s print dialog. Choose “Save as PDF” (on iPhone, share, then Save to Files).</p>'}
function cover(){return'<svg width="150" height="150" viewBox="0 0 64 64" aria-hidden="true"><path d="M18 12h22a8 8 0 0 1 8 8v32H26a8 8 0 0 1-8-8z" fill="none" stroke="#e6c98f" stroke-width="2.5"/><path d="M26 24h14M26 31h14M26 38h8" stroke="#e6c98f" stroke-width="2.5" stroke-linecap="round"/><path d="M40 12v13l4-3 4 3V13" fill="none" stroke="#e6c98f" stroke-width="2"/></svg><h1>Lorebound</h1><p>a webtoon reading journal</p><p>'+db.items.length+' titles logged</p><a class="open" href="#index">Open the journal</a>'}
function render(keep){var y=scrollY,p=location.hash.slice(1).split("/"),h,it;
if(p[0]=="t"&&(it=by(p[1])))h=title(it);else if(p[0]=="fav")h=fav();else if(p[0]=="grave")h=grave();else if(p[0]=="dna")h=dna();else if(p[0]=="tools")h=tools();else if(p[0]=="index"){h=home()}else{p=["cover"];h=cover()}
document.body.className=p[0]=="cover"?"cv":"";$("main").innerHTML=h;
$("nav").innerHTML=[["index","Index"],["fav","Favourites"],["grave","Graveyard"],["dna","Reading DNA"],["tools","Backup"]].map(function(n){return'<a href="#'+n[0]+'"'+((n[0]==p[0]||(n[0]=="index"&&p[0]=="t"))?' class="on"':'')+'>'+n[1]+'</a>'}).join("");
scrollTo(0,keep?y:0)}
addEventListener("hashchange",function(){render(false)});

function pdfItem(it,j){var h='<div class="pg"><h2>'+pad(j+1)+'  '+esc(it.title)+'</h2><p>'+[it.genre,it.eps&&it.eps+" episodes",it.status].filter(Boolean).map(esc).join(", ")+'</p>';
SEC.forEach(function(s,si){var r="";s[1].forEach(function(f,fi){if(!f)return;var v=fv(f,it.d[si+"."+fi]);if(v)r+='<p><b>'+f[1]+'</b><br>'+esc(v).replace(/\n/g,"<br>")+'</p>'});if(r)h+='<h3>'+s[0]+'</h3>'+r});
if((it.m||[]).length){h+='<h3>Marginalia</h3>';it.m.forEach(function(m){h+='<p>Ep. '+esc(m.ep)+': '+esc(m.n)+'</p>'})}
if((it.col||[]).length){h+='<h3>Favourite scenes</h3><div class="im">';it.col.forEach(function(c){h+='<img src="'+imgOf(c)+'" alt="">'});h+='</div>'}

function exportPDF(only){var h='';
if(!only){h='<h1>Lorebound</h1><p>'+db.items.length+' logged'+(db.total?' of '+esc(db.total):'')+'</p>';
db.items.forEach(function(x,j){h+='<p>'+pad(j+1)+'  '+esc(x.title)+' ('+esc(x.status)+')</p>'});
var r="";FAV.forEach(function(f,j){if(db.fav[j])r+='<p><b>'+f+'</b><br>'+esc(db.fav[j])+'</p>'});if(r)h+='<h3>The favourites</h3>'+r;
r="";DNA.forEach(function(d){if(db.dna[d[0]])r+='<p><b>'+d[1]+'</b><br>'+esc(db.dna[d[0]])+'</p>'});if(r)h+='<h3>My reading DNA</h3>'+r;

(only?[by(only)]:db.items).forEach(function(it){h+=pdfItem(it,db.items.indexOf(it))});

addEventListener("afterprint",function(){$("print").innerHTML=""});

function restore(file){var r=new FileReader();r.onload=function(){try{var o=JSON.parse(r.result);if(!o.items)throw 0;if(!confirm("Replace the current journal with this backup?"))return;db.items.forEach(function(it){(it.col||[]).forEach(dropImg)});db=o;norm();migrate();doSave();msg="Restored.";render(false)}catch(x){setMsg("That file is not a Lorebound backup.")}};r.readAsText(file)}
function addImgs(it,files){it.col=it.col||[];var left=files.length;Array.prototype.forEach.call(files,function(file){var r=new FileReader();r.onload=function(){var im=new Image();im.onload=function(){var s=Math.min(1,480/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=im.width*s;c.height=im.height*s;c.getContext("2d").drawImage(im,0,0,c.width,c.height);it.col.push({i:putImg(c.toDataURL("image/jpeg",.72)),x:5+Math.random()*45,y:4+Math.random()*40,r:Math.round(Math.random()*12-6)});if(--left==0){save();render(true)}};im.src=r.result};r.readAsDataURL(file)})}
document.addEventListener("click",function(e){var t=e.target.closest("button"),d,it,a;if(!t)return;d=t.dataset;it=d.id&&by(d.id);a=d.act;
